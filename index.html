<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelajah IPA: Kuis Cerdas</title>
    <style>
        /* Desain Tampilan Game */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }

        h1 { color: #4a00e0; margin-bottom: 10px; }
        p { font-size: 1.1rem; line-height: 1.6; }

        .btn {
            background: #4a00e0;
            color: white;
            border: none;
            padding: 15px 25px;
            margin: 10px 5px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 300px;
            display: inline-block;
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(74, 0, 224, 0.4); }
        .btn:active { transform: translateY(0); }

        .option-btn { background: #fff; color: #333; border: 2px solid #4a00e0; }
        .option-btn:hover { background: #f0f0ff; }

        .correct { background: #2ecc71 !important; color: white !important; border-color: #2ecc71 !important; }
        .wrong { background: #e74c3c !important; color: white !important; border-color: #e74c3c !important; }

        .hidden { display: none; }
        
        .score-board {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4a00e0;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #ddd;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #4a00e0;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Halaman Awal -->
        <div id="start-screen">
            <h1> Jelajah IPA</h1>
            <p>Uji pengetahuanmu tentang Sains Alam!</p>
            <p>Siap menjadi ilmuwan cilik?</p>
            <button class="btn" onclick="startGame()">Mulai Petualangan 🚀</button>
        </div>

        <!-- Halaman Kuis -->
        <div id="quiz-screen" class="hidden">
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
            <div class="score-board">Skor: <span id="score">0</span></div>
            <h2 id="question-text">Pertanyaan disini...</h2>
            <div id="options-container">
                <!-- Tombol jawaban akan muncul disini -->
            </div>
        </div>

        <!-- Halaman Hasil -->
        <div id="result-screen" class="hidden">
            <h1> Selesai!</h1>
            <p>Kamu mendapatkan skor:</p>
            <h2 style="font-size: 3rem; color: #4a00e0;" id="final-score">0</h2>
            <p id="feedback-text">Keren banget!</p>
            <button class="btn" onclick="restartGame()">Main Lagi 🔄</button>
        </div>
    </div>

    <script>
        // Data Pertanyaan IPA
        const questions = [
            {
                q: "Planet terbesar di tata surya kita adalah...",
                options: ["Bumi", "Mars", "Jupiter", "Saturnus"],
                answer: 2 // Index jawaban benar (Jupiter)
            },
            {
                q: "Proses tumbuhan membuat makanan sendiri dengan bantuan cahaya matahari disebut...",
                options: ["Respirasi", "Fotosintesis", "Adaptasi", "Evolusi"],
                answer: 1
            },
            {
                q: "Hewan yang memakan daging saja disebut...",
                options: ["Herbivora", "Omnivora", "Karnivora", "Insektivora"],
                answer: 2
            },
            {
                q: "Gaya yang menyebabkan benda jatuh ke bumi adalah...",
                options: ["Gaya Gesek", "Gaya Magnet", "Gaya Gravitasi", "Gaya Pegas"],
                answer: 2
            },
            {
                q: "Bagian tumbuhan yang berfungsi menyerap air dari tanah adalah...",
                options: ["Daun", "Batang", "Akar", "Bunga"],
                answer: 2
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let canAnswer = false;

        // Fungsi Memulai Game
        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            currentQuestionIndex = 0;
            score = 0;
            updateScore();
            showQuestion();
        }

        // Menampilkan Pertanyaan
        function showQuestion() {
            const qData = questions[currentQuestionIndex];
            document.getElementById('question-text').innerText = qData.q;
            
            const optionsDiv = document.getElementById('options-container');
            optionsDiv.innerHTML = ''; // Kosongkan opsi lama

            // Update Progress Bar
            const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
            document.getElementById('progress').style.width = progressPercent + '%';

            // Buat tombol untuk setiap opsi
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsDiv.appendChild(btn);
            });

            canAnswer = true;
        }

        // Cek Jawaban
        function checkAnswer(selectedIndex, btnElement) {
            if (!canAnswer) return; // Mencegah klik ganda
            canAnswer = false;

            const correctIndex = questions[currentQuestionIndex].answer;
            const allButtons = document.querySelectorAll('.option-btn');

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score += 20; // 100 dibagi 5 soal = 20 poin per soal
                updateScore();
            } else {
                btnElement.classList.add('wrong');
                // Tunjukkan jawaban yang benar
                allButtons[correctIndex].classList.add('correct');
            }

            // Lanjut ke soal berikutnya setelah 1 detik
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    showQuestion();
                } else {
                    endGame();
                }
            }, 1200);
        }

        function updateScore() {
            document.getElementById('score').innerText = score;
        }

        // Game Selesai
        function endGame() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
            
            let feedback = "";
            if (score === 100) feedback = "Sempurna! Kamu Ilmuwan Sejati! ";
            else if (score >= 80) feedback = "Hebat! Pengetahuanmu luas! 🌟";
            else if (score >= 60) feedback = "Bagus! Terus belajar ya! 📚";
            else feedback = "Jangan menyerah, coba lagi! 💪";
            
            document.getElementById('feedback-text').innerText = feedback;
        }

        function restartGame() {
            startGame();
        }
    </script>
</body>
</html>
